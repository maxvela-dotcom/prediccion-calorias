<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }} · Predicción de Calorías</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
    .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:28px;max-width:460px;width:100%;text-align:center}
    h1{margin:0 0 12px;font-size:1.5rem}
    p{color:#94a3b8;line-height:1.5}
    a{display:inline-block;margin-top:16px;color:#fff;text-decoration:none;background:#3b82f6;padding:10px 16px;border-radius:8px;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <a href="{{ enlace_url }}">{{ enlace_texto }}</a>
  </div>
</body>
</html>
