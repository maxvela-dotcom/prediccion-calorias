<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <title>Ingresar · Escuela de Fútbol</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: linear-gradient(160deg, #ecfdf5, #f8fafc 55%, #e2e8f0); color: #0f172a; }
    .login { width: min(430px, 100%); background: #fff; border: 1px solid #e2e8f0;
             border-radius: 20px; padding: 30px; box-shadow: 0 18px 50px rgba(15,23,42,.10); }
    .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .marca .logo { width: 46px; height: 46px; display: grid; place-items: center; font-size: 26px;
                   background: #0f766e; border-radius: 14px; }
    h1 { font-size: 20px; margin: 0; }
    .marca p { margin: 3px 0 0; font-size: 12px; color: #64748b; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px;
            font: inherit; outline: none; }
    input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
    button { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 10px;
             background: #0f766e; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button:hover { background: #115e59; }
    .error { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
             background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .demo { margin-top: 24px; border-top: 1px dashed #cbd5e1; padding-top: 16px; }
    .demo h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin: 0 0 10px; }
    .cred { display: flex; justify-content: space-between; gap: 8px; width: 100%; margin: 6px 0;
            padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc;
            color: #334155; font-size: 12px; font-weight: 600; cursor: pointer; text-align: left; }
    .cred:hover { border-color: #0f766e; background: #f0fdfa; }
    .cred code { font-size: 12px; color: #0f766e; }
    .nota { margin-top: 14px; font-size: 11px; color: #64748b; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="login">
    <div class="marca">
      <div class="logo">⚽</div>
      <div>
        <h1>Escuela de Fútbol</h1>
        <p>Asistencias compartidas · ingresa con tu rol</p>
      </div>
    </div>

    <form method="post" action="/escuela/login">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required value="{{ usuario or '' }}">

      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>

      <button type="submit">Ingresar</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <p class="nota">
      Usa la cuenta que creaste en el primer arranque. Si todavía no existe
      ningún administrador, abre <a href="/escuela/setup">/escuela/setup</a>.
    </p>
  </div>
</body>
</html>
